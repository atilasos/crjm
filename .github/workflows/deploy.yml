name: Validate and deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Read wasm-bindgen version from Cargo locks
        id: wasm-bindgen
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          versions = {
              package['version']
              for lockfile in Path('wasm').glob('*/Cargo.lock')
              for package in tomllib.loads(lockfile.read_text())['package']
              if package['name'] == 'wasm-bindgen'
          }
          if len(versions) != 1:
              raise SystemExit(f'Expected one shared wasm-bindgen version, got {versions}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={versions.pop()}\n')

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wasm/dominorio_ai/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('wasm/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-bindgen-cli
        env:
          WASM_BINDGEN_VERSION: ${{ steps.wasm-bindgen.outputs.version }}
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $WASM_BINDGEN_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build (with WASM)
        run: bun run build

      - name: Verify all WASM engines are included
        run: |
          bun -e '
            const engines = {
              dominorio: "dominorio_ai",
              quelhas: "quelhas_wasm",
              produto: "produto_ai",
              "atari-go": "atari_go_ai",
              nex: "nex_ai",
            };
            for (const [game, module] of Object.entries(engines)) {
              const file = `dist/ai/${game}/wasm/pkg/${module}_bg.wasm`;
              await WebAssembly.compile(await Bun.file(file).arrayBuffer());
              console.log(`Verified ${game}`);
            }
          '

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
