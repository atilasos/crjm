[package]
name = "produto_ai"
version = "0.1.0"
edition = "2021"
description = "Produto AI engine for WASM (CRJM)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
